<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gestion de cave à vin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cave à Vin">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Cave à Vin</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Identity Services (GIS) — OAuth 2.0 token client -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Tesseract.js — OCR pour pré-traiter les étiquettes de vin -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script>
    window.cvOcrRecognize = async function(base64) {
      try {
        if (typeof Tesseract === 'undefined') return null;
        const dataUrl = 'data:image/jpeg;base64,' + base64;
        const result = await Tesseract.recognize(dataUrl, 'fra+eng', {
          // Pas de log pour ne pas polluer la console
        });
        const text = result && result.data ? result.data.text : null;
        if (!text) return null;
        // Nettoie : supprime lignes vides multiples, trim
        return text
          .split('\n')
          .map(function(l) { return l.trim(); })
          .filter(function(l) { return l.length > 0; })
          .join('\n');
      } catch (e) {
        console.warn('OCR Tesseract erreur:', e);
        return null;
      }
    };
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0E0C0A;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0E0C0A;
      z-index: 999;
      transition: opacity 0.3s ease;
    }
    #splash img {
      max-width: 40vmin;
      max-height: 40vmin;
      object-fit: contain;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="splash-logo.png" alt="">
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
      caches.keys().then(function(names) {
        names.forEach(function(n) { caches.delete(n); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function() { s.remove(); }, 300); }
    });
  </script>
</body>
</html>
